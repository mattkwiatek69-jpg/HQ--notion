<title>Primal Health Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a butcher's counter. Char-dark rail, a marbled section band over a grouped index, and one open card beside it. Phones get index, then card. */
:root{
  --bg:#f6ebdd; --panel:#fffaf2; --sunk:#efdfcb; --ink:#22100d; --ink-2:#55352e; --mute:#76564c;
  --line:#e3ceb8; --line-2:#cdb199; --raw:#c8141b; --raw-ink:#fff6ec; --raw-soft:#f8d9d0; --yolk:#ffb81f; --yolk-ink:#2e1c00; --yolk-soft:#ffe9ad;
  --oj:#f0610c; --ox:#5d0e14; --white:#fffdf8; --rail:#24100e; --rail-ink:#f6e6d6; --rail-2:#b79888; --scrim:rgba(34,16,13,.55);
  --tS:#9a6400; --tA:#c8141b; --tB:#c2500a; --tC:#76564c; --tD:#55352e;
  --f-d:"Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",sans-serif; --f-b:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail-w:212px; --idx-w:372px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#190b0a; --panel:#25110f; --sunk:#1f0e0c; --ink:#f8eadb; --ink-2:#dcc2b3; --mute:#b0948a;
  --line:#3d1f1b; --line-2:#59322b; --raw:#ff5148; --raw-ink:#1a0706; --raw-soft:#4a1614; --yolk:#ffc53d; --yolk-ink:#2e1c00; --yolk-soft:#4a3508;
  --oj:#ff7d2e; --ox:#7a1820; --white:#f3e3d2; --rail:#0f0605; --rail-ink:#f6e6d6; --rail-2:#a08377; --scrim:rgba(0,0,0,.66);
  --tS:#ffc53d; --tA:#ff5148; --tB:#ff8f4d; --tC:#c2a698; --tD:#b0948a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#190b0a; --panel:#25110f; --sunk:#1f0e0c; --ink:#f8eadb; --ink-2:#dcc2b3; --mute:#b0948a;
  --line:#3d1f1b; --line-2:#59322b; --raw:#ff5148; --raw-ink:#1a0706; --raw-soft:#4a1614; --yolk:#ffc53d; --yolk-ink:#2e1c00; --yolk-soft:#4a3508;
  --oj:#ff7d2e; --ox:#7a1820; --white:#f3e3d2; --rail:#0f0605; --rail-ink:#f6e6d6; --rail-2:#a08377; --scrim:rgba(0,0,0,.66);
  --tS:#ffc53d; --tA:#ff5148; --tB:#ff8f4d; --tC:#c2a698; --tD:#b0948a; color-scheme:dark}
/* section bands keep their food colour in both themes */
body{--band:#c8141b;--band-ink:#fff6ec}
body[data-tab="today"]{--band:#ffb81f;--band-ink:#2e1c00}
body[data-tab="routines"]{--band:#c8141b;--band-ink:#fff6ec}
body[data-tab="food"]{--band:#f0610c;--band-ink:#22100d}
body[data-tab="methods"]{--band:#5d0e14;--band-ink:#ffe9ad}
body[data-tab="library"]{--band:#33201a;--band-ink:#ffcf5c}

*{box-sizing:border-box}
html{scrollbar-color:var(--line-2) transparent}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;caret-color:var(--raw)}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
::selection{background:var(--yolk);color:var(--yolk-ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);margin:0;font-weight:900;letter-spacing:.005em;line-height:1;text-wrap:balance;text-transform:uppercase}
p{margin:0}
a{color:var(--raw);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px;border-radius:6px}
svg.i{width:22px;height:22px;flex:0 0 auto;fill:currentColor}
svg.s{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.rail{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in h1{font-size:24px;white-space:nowrap}
.search{position:relative;flex:1 1 auto;min-width:0;max-width:440px;margin-left:auto}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding:9px 12px 9px 36px;border:1.500px solid var(--line-2);border-radius:99px;background:var(--panel)}
.search input::placeholder{color:var(--mute)}
#app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wide{max-width:860px;margin:0 auto;display:grid;gap:18px;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--rail);color:var(--rail-2);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.bnav a{padding:9px 2px 8px;display:grid;justify-items:center;gap:2px;font-size:11.500px;font-weight:700;text-decoration:none;color:inherit;min-width:0}
.bnav a[aria-current="page"]{color:var(--yolk)}
.split .detail{display:none}
.split.show-detail .index{display:none}
.split.show-detail .detail{display:block}
@media (min-width:1000px){
  html,body{height:100%}
  .rail{display:flex;flex-direction:column;gap:22px;position:fixed;inset:0 auto 0 0;width:var(--rail-w);padding-block:calc(20px + env(safe-area-inset-top,0px)) 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;background:var(--rail);color:var(--rail-ink);overflow-y:auto;z-index:8}
  .main{margin-left:var(--rail-w);height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .bnav,.top-in h1,.back{display:none!important}
  .top{position:static}
  .top-in{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
  .search{margin-left:0}
  #app{padding-bottom:0;overflow-y:auto;min-height:0}
  #app.is-split{overflow:hidden}
  .split{display:grid;grid-template-columns:var(--idx-w) minmax(0,1fr);height:100%}
  .split .index,.split .detail,.split.show-detail .index{display:block;overflow-y:auto;min-height:0}
  .split .index{border-right:1px solid var(--line)}
  .wide{padding-inline:28px;padding-block:24px 48px}
}
.logo{display:flex;gap:10px;align-items:center;padding:0 4px}
.logo i{width:38px;height:38px;border-radius:50%;background:var(--yolk);color:#2e1c00;display:grid;place-items:center;flex:0 0 auto}
.logo b{font:900 21px/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;display:block}
.logo small{font-size:12px;color:var(--rail-2)}
.rnav{display:grid;gap:3px}
.rnav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;text-decoration:none;color:var(--rail-2);font-weight:700}
.rnav a:hover{color:var(--rail-ink)}
.rnav a[aria-current="page"]{background:var(--nb);color:var(--ni)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-2);padding:0 4px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.500px solid var(--line-2);background:var(--panel);padding:8px 13px;border-radius:99px;cursor:pointer;font-weight:700;font-size:13.500px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--raw);color:var(--raw-ink);border-color:var(--raw)}
.btn.onband{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.btn.danger{color:var(--raw)}
.btn.armed{background:var(--raw);border-color:var(--raw);color:var(--raw-ink)}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--mute);display:grid;place-items:center;flex:0 0 auto}
.ib:hover{background:var(--sunk);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.500px solid var(--line-2);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inp,select,textarea{width:100%;padding:9px 11px;border:1.500px solid var(--line-2);border-radius:10px;background:var(--panel);min-width:0}
textarea{resize:vertical;min-height:230px;font:500 13px/1.550 ui-monospace,Menlo,Consolas,monospace}
.fld{display:grid;gap:4px;min-width:0}
.fld>label,.fld>span{font-size:12.500px;font-weight:700;color:var(--ink-2)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}

/* band: the marbled cut at the head of each section */
.band{position:relative;overflow:hidden;background:var(--band);color:var(--band-ink);padding-block:22px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.band>svg.marb{position:absolute;inset:0;width:100%;height:100%;opacity:.2;pointer-events:none}
.band>svg.cut{position:absolute;right:-18px;bottom:-26px;width:150px;height:150px;fill:var(--band-ink);opacity:.16;pointer-events:none}
.band>*{position:relative}
.band h2{font-size:52px}
.band p{font-weight:600;max-width:34ch;line-height:1.350}
.band-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools{padding:12px 14px 4px;display:grid;gap:10px}

/* index */
.grp{padding:14px 14px 2px;display:flex;align-items:baseline;gap:8px}
.grp h3{font-size:19px;color:var(--ink)}
.grp span{font-size:12.500px;color:var(--mute);font-weight:600}
button.grp{width:100%;background:none;border:0;cursor:pointer;text-align:left;border-top:1px solid var(--line);padding-block:13px}
button.grp svg{margin-left:auto;color:var(--mute);transition:transform .15s}
button.grp[aria-expanded="true"] svg{transform:rotate(90deg)}
.sub{padding:8px 14px 2px;font-size:12.500px;font-weight:800;color:var(--raw)}
.rows{display:grid;padding:2px 8px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:9px 8px;cursor:pointer}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:var(--ink);color:var(--bg)}
.row b{font-weight:700;overflow-wrap:anywhere;min-width:0}
.row small{grid-column:1;font-size:12.500px;color:var(--mute);font-weight:500}
.row[aria-current="true"] small{color:inherit;opacity:.75}
.row.thin b{font-weight:500;color:var(--mute)}
.row[aria-current="true"].thin b{color:inherit}
.row .mk{grid-row:1/3;grid-column:2;font-size:11.500px;font-weight:800;color:var(--mute)}
.row[aria-current="true"] .mk{color:inherit}
.pad{padding:16px 14px;color:var(--mute)}

/* detail */
.detail-in{max-width:760px;display:grid;gap:16px;padding-block:20px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:1000px){.detail-in{padding:28px 34px 56px}}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;font-weight:800;color:var(--raw);cursor:pointer;justify-self:start}
.dh{display:grid;gap:10px}
.dh h2{font-size:44px;overflow-wrap:anywhere}
.dmeta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13.500px;color:var(--ink-2);font-weight:600}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.course{background:var(--yolk);color:var(--yolk-ink)}
.tag.notes{border:1.500px solid var(--line-2);color:var(--ink-2)}
.sched{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.note{background:var(--yolk-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px}
.note.plain{background:var(--sunk)}
ul.items{list-style:none;margin:0;padding:0;display:grid}
.it{border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}
.it:first-child{border-top:0}
.it .line{grid-column:2;display:flex;gap:9px;align-items:center;padding:10px 0;background:none;border:0;text-align:left;width:100%;min-width:0}
button.line{cursor:pointer}
.it .nm{font-weight:700;overflow-wrap:anywhere;min-width:0;flex:1}
.it .ms{font-size:12px;font-weight:800;background:var(--sunk);color:var(--ink-2);border-radius:99px;padding:2px 9px;white-space:nowrap}
.it .more{color:var(--mute);transition:transform .15s}
button.line[aria-expanded="true"] .more{transform:rotate(90deg)}
.it .det{grid-column:2;margin:0 0 12px;color:var(--ink-2);font-size:14.500px;white-space:pre-line;overflow-wrap:anywhere;max-width:66ch}
.it.x .nm{text-decoration:line-through;color:var(--mute);font-weight:500}
.it.hd{border-top:0}
.it.hd .line{padding:18px 0 2px}
.it.hd .nm{font:900 22px/1 var(--f-d);text-transform:uppercase;color:var(--raw)}
.it.pp{border-top:0}
.it.pp .line{padding:6px 0;color:var(--ink-2);max-width:66ch;display:block}
.stamp{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--tc);border:2px solid currentColor;box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px currentColor;font:900 14px/1 var(--f-d);transform:rotate(-9deg);background:var(--panel)}
.stamp.S{--tc:var(--tS)}.stamp.A{--tc:var(--tA)}.stamp.B{--tc:var(--tB)}.stamp.C{--tc:var(--tC)}.stamp.D{--tc:var(--tD)}
.tick{grid-column:1;margin:7px 11px 0 0;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:var(--white);cursor:pointer;display:grid;place-items:center;color:transparent;padding:0;transition:background .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1)}
.tick[aria-checked="true"]{background:var(--raw);border-color:var(--raw);color:var(--raw-ink)}
.tick:active{transform:scale(.88)}
.tick:disabled{opacity:.5;cursor:not-allowed}
.it.done .nm{color:var(--mute)}
.quick{display:flex;gap:6px}
.quick input{flex:1}
.blank{border:1.500px dashed var(--line-2);border-radius:14px;padding:18px;display:grid;gap:8px;color:var(--ink-2);justify-items:start}
.blank b{font:900 22px/1 var(--f-d);text-transform:uppercase;color:var(--ink)}

/* food board */
.board{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.board h3{font-size:24px;color:var(--raw);margin-bottom:6px}
.board ul{list-style:none;margin:0;padding:0;display:grid}
.board li{display:flex;gap:9px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-weight:600}
.board li:first-child{border-top:0}

/* today */
.thead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.thead h2{font-size:48px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats b{font:900 30px/1 var(--f-d);display:block;font-variant-numeric:tabular-nums}
.stats span{font-size:12.500px;color:var(--mute);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1.500px solid transparent;background:none;border-radius:14px;padding:8px 0;display:grid;justify-items:center;gap:3px;cursor:pointer;min-width:0}
.day b{font-size:12.500px;color:var(--mute);font-weight:700}
.day[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.day.today b{color:var(--raw);font-weight:800}
.egg{width:42px;height:42px;max-width:100%}
.egg .wh{fill:var(--white);stroke:var(--line-2);stroke-width:1.500}
.egg .yk{fill:var(--yolk);transition:r .5s cubic-bezier(.16,1,.3,1)}
.egg text{font:800 12px var(--f-b);fill:var(--yolk-ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.tl{display:grid;gap:8px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.tcard-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;cursor:pointer;text-align:left}
.tcard-h b{font:900 22px/1.050 var(--f-d);text-transform:uppercase;display:block;overflow-wrap:anywhere}
.tcard-h small{font-size:12.500px;color:var(--mute);font-weight:600}
.tcard-h>span:not(.more){flex:1;min-width:0}
.tcard-h .more{color:var(--mute);transition:transform .15s}
.tcard.open .tcard-h .more{transform:rotate(90deg)}
.tcard-b{padding:0 14px 12px 14px}
.tcard.full{background:var(--raw-soft);border-color:transparent}
.plan{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.plan table{border-collapse:collapse;width:100%;min-width:440px;font-size:13.500px}
.plan th{font-size:12px;color:var(--mute);padding:8px 2px;font-weight:700}
.plan td{padding:5px 2px;border-top:1px solid var(--line);text-align:center}
.plan td:first-child,.plan th:first-child{text-align:left;padding-left:14px;font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:var(--white);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{background:var(--yolk);border-color:var(--yolk)}
.sec-h{font-size:26px;margin-top:8px}

/* sources */
.sblock{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.srow b{font-weight:700;overflow-wrap:anywhere}
.srow small{color:var(--mute);display:block;font-size:12.500px}
.srow.docrow{border-top:0;background:var(--sunk)}
.srow.docrow b{font:900 22px/1 var(--f-d);text-transform:uppercase}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
@media (min-width:760px){.sheet{left:auto;top:0;width:min(580px,100%);max-height:none;border-radius:0;padding-top:calc(22px + env(safe-area-inset-top,0px))}}
.sheet-h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sheet-h h2{font-size:32px}
.sheet-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:12px}
.hint{font-size:12.500px;color:var(--mute)}
.hint code{background:var(--sunk);padding:0 4px;border-radius:4px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.notice{background:var(--yolk-soft);border-radius:12px;padding:11px 14px;font-size:14px;margin:12px 14px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<aside class="rail">
  <div class="logo"><i id="logoI"></i><div><b>Primal Health</b><small>Routines, food, methods</small></div></div>
  <nav class="rnav" id="rnav" aria-label="Sections"></nav>
  <div class="rail-foot" id="railfoot"></div>
</aside>
<div class="main">
  <header class="top"><div class="top-in"><h1 id="topT">Today</h1>
    <label class="search"><svg class="s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" type="search" placeholder="Search routines, foods, lessons" aria-label="Search everything"></label>
  </div></header>
  <main id="app"><p class="pad">Loading your hub…</p></main>
</div>
<nav class="bnav" id="bnav" aria-label="Sections"></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";

  var co=cs.filter(isCourse),no=cs.filter(function(c){return !isCourse(c);});
  if(co.length)h+='<h3 class="sec-h">From the course</h3><div class="tl">'+co.map(tcard).join("")+'</div>';
  if(no.length)h+='<h3 class="sec-h">From my notes</h3><div class="tl">'+no.map(tcard).join("")+'</div>';
  if(!cs.length)h+='<div class="blank"><b>Rest day</b><p>Nothing is scheduled for this day. Set days in the week plan below.</p></div>';
  var rs=list().filter(function(c){return c.area==="routines"&&((c.days||[]).length||!isCourse(c)||(c.items||[]).length||c.dur);});
  h+='<h3 class="sec-h">Week plan</h3><div class="plan"><table><thead><tr><th>Routine</th>'+DAYS.map(function(x){return "<th>"+x+"</th>";}).join("")+'</tr></thead><tbody>'+rs.map(function(c){return '<tr><td>'+esc(c.title)+'</td>'+DAYS.map(function(x,n){return '<td><button class="dot" data-act="plan" data-c="'+esc(c.id)+'" data-n="'+n+'" aria-pressed="'+((c.days||[]).indexOf(n)>=0)+'" aria-label="'+esc(c.title)+" on "+x+'"'+(S.ro?" disabled":"")+'></button></td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>';
  return h+'</div>';
}
function renderSources(v){
  var docs={},order=[];list().forEach(function(c){var d=(c.src&&c.src.doc)||"Added in the hub";if(!docs[d]){docs[d]=[];order.push(d);}docs[d].push(c);});
  var h='<div class="wide">'+bandHtml(v,"Every card grouped by where it came from. Delete one section or a whole source in two taps.")+'<div style="margin:-6px -14px 0">'+libSeg()+'</div>';
  order.forEach(function(d){var cs=docs[d],ak="doc:"+d;
    h+='<div class="sblock"><div class="srow docrow"><div><b>'+esc(d)+'</b><small>'+cs.length+" cards, "+cs.reduce(function(n,c){return n+(c.items||[]).length;},0)+' lines</small></div>'+(S.ro?"":'<button class="btn danger'+(S.armed===ak?" armed":"")+'" data-act="deldoc" data-d="'+esc(d)+'">'+(S.armed===ak?"Confirm: delete all "+cs.length:"Delete whole source")+'</button>')+'</div>';
    cs.forEach(function(c){var k="card:"+c.id;h+='<div class="srow"><div><b>'+esc(c.title)+'</b><small>'+esc((c.src&&c.src.sec)||"")+" · now in "+esc(c.area)+'</small></div>'+(S.ro?"":'<button class="btn danger'+(S.armed===k?" armed":"")+'" data-act="delcard" data-c="'+esc(c.id)+'">'+(S.armed===k?"Confirm delete":"Delete")+'</button>')+'</div>';});
    h+='</div>';});
  return h+'</div>';
}
function render(){
  var v=view(),V=VIEWS.filter(function(x){return x[0]===v;})[0],q=S.q.trim().toLowerCase(),app=$("app");
  var keep={};["pIdx","pDet"].forEach(function(id){var e=$(id);if(e)keep[id]=e.scrollTop;});var prev=app.dataset.k;
  document.body.dataset.tab=v;$("topT").textContent=q?"Search":V[1];
  var nav=function(){return VIEWS.map(function(x){return '<a href="#'+x[0]+'" style="--nb:'+x[2]+";--ni:"+x[3]+'"'+(x[0]===v?' aria-current="page"':"")+'>'+ic(x[0])+'<span>'+x[1]+'</span></a>';}).join("");};
  $("rnav").innerHTML=nav();$("bnav").innerHTML=nav();$("logoI").innerHTML=ic("today");
  var n=list().length;$("railfoot").textContent=S.loaded?n+" cards stored":"";
  var h,split=false;
  if(!S.loaded)h='<p class="pad">Loading your hub…</p>';
  else if(q){h=renderSplit(V,q);split=true;}
  else if(v==="today")h=renderToday();
  else if(v==="library"&&S.lib==="sources")h=renderSources(V);
  else{h=renderSplit(V);split=true;}
  app.className=split?"is-split":"";app.innerHTML=h;
  var k=v+"|"+q+"|"+S.lib;app.dataset.k=k;
  if(prev===k){if(keep.pIdx!=null&&$("pIdx"))$("pIdx").scrollTop=keep.pIdx;if(keep.pDet!=null&&$("pDet")&&render.sel===(S.cur&&S.cur.sel))$("pDet").scrollTop=keep.pDet;}
  render.sel=S.cur&&S.cur.sel;
}

/* ---------- editor ---------- */
function toText(items){return (items||[]).map(function(i){if(i.h)return "# "+i.t;if(i.p)return "> "+i.t;return (i.x?"~ ":"")+(i.tier?"["+i.tier+"] ":"")+i.t+(i.m?" {"+i.m+"}":"")+(i.d?" | "+i.d.replace(/\n/g," // "):"");}).join("\n");}
function parseLine(l,old,used){
  l=l.trim();if(!l)return null;var it={},prev;
  if(l.charAt(0)==="#")it={t:l.replace(/^#+\s*/,""),h:true};
  else if(l.charAt(0)===">")it={t:l.slice(1).trim(),p:true};
  else{if(l.charAt(0)==="~"){it.x=true;l=l.slice(1).trim();}
    var m=l.match(/^\[([SABCD])\]\s*/i);if(m){it.tier=m[1].toUpperCase();l=l.slice(m[0].length);}
    var p=l.indexOf(" | "),name=(p<0?l:l.slice(0,p)).trim();if(p>=0)it.d=l.slice(p+3).split(" // ").join("\n").trim();
    var mm=name.match(/^(.*?)\s*\{([^}]*)\}$/);if(mm){name=mm[1];it.m=mm[2].trim();}it.t=name;}
  prev=(old||[]).filter(function(o){return o.t===it.t&&!used[o.id];})[0];if(prev){it.id=prev.id;used[prev.id]=1;}
  return it;
}
function fromText(txt,old){var used={},out=txt.split("\n").map(function(l){return parseLine(l,old,used);}).filter(Boolean),n=Date.now();
  (old||[]).forEach(function(o){used[o.id]=used[o.id]||0;});
  out.forEach(function(i){if(!i.id){do{i.id="n"+(n++).toString(36);}while(i.id in used);used[i.id]=1;}});return out;}
function openEditor(c,isNew){
  var groups=[];list().forEach(function(x){if(groups.indexOf(x.group)<0)groups.push(x.group);});
  var h='<div class="sheet-wrap"><div class="scrim" data-act="close"></div><form class="sheet" id="edf"><div class="sheet-h"><h2>'+(isNew?"New card":"Edit card")+'</h2><button type="button" class="ib" data-act="close" aria-label="Close">'+si("x")+'</button></div>'+
  '<div class="fld"><label for="e-title">Title</label><input class="inp" id="e-title" required value="'+esc(c.title)+'"></div>'+
  '<div class="fgrid"><div class="fld"><label for="e-area">Section</label><select id="e-area">'+VIEWS.slice(1).map(function(a){return '<option value="'+a[0]+'"'+(a[0]===c.area?" selected":"")+'>'+a[1]+'</option>';}).join("")+'</select></div>'+
  '<div class="fld"><label for="e-group">Group</label><input class="inp" id="e-group" list="e-groups" value="'+esc(c.group||"")+'"><datalist id="e-groups">'+groups.map(function(g){return '<option value="'+esc(g)+'">';}).join("")+'</datalist></div>'+
  '<div class="fld"><label for="e-kind">Type</label><select id="e-kind"><option value="routine"'+(c.kind==="routine"?" selected":"")+'>Routine (how-tos fold away)</option><option value="list"'+(c.kind==="list"?" selected":"")+'>List</option><option value="note"'+(c.kind==="note"?" selected":"")+'>Reading (always open)</option></select></div></div>'+
  '<div class="fld"><label for="e-note">Note shown at the top of the card</label><input class="inp" id="e-note" value="'+esc(c.note||"")+'"></div>'+
  '<div class="fld"><label for="e-items">Items, one per line</label><textarea id="e-items" spellcheck="false">'+esc(toText(c.items))+'</textarea><p class="hint"><code>Name {30 sec} | how to do it</code> keeps the how-to behind the name. <code># Heading</code> starts a sub-section. <code>&gt; text</code> is a plain paragraph. <code>[S] Name</code> grades a food S, A, B, C or D. <code>~ Name</code> strikes it through. <code> // </code> breaks a line inside a how-to.</p></div>'+
  '<div class="fgrid"><div class="fld"><label for="e-doc">Source</label><input class="inp" id="e-doc" value="'+esc((c.src&&c.src.doc)||"")+'" placeholder="Where this came from"></div><div class="fld"><label for="e-sec">Source section</label><input class="inp" id="e-sec" value="'+esc((c.src&&c.src.sec)||"")+'"></div></div>'+
  '<div class="fld"><label for="e-url">Lesson link</label><input class="inp" id="e-url" type="url" value="'+esc(c.url||"")+'" placeholder="https://"></div>'+
  '<div class="sheet-f">'+(isNew?"<span></span>":'<button type="button" class="btn danger" data-act="edel">Delete card</button>')+'<span style="display:flex;gap:8px"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save card</button></span></div></form></div>';
  $("sheet").innerHTML=h;document.body.classList.add("locked");openEditor.c=c;$("e-title").focus();
}
function closeSheet(){$("sheet").innerHTML="";document.body.classList.remove("locked");}
function areaKey(c){return c.area+(c.area==="library"?":"+(isCourse(c)?"course":"notes"):"");}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,c=b.dataset.c&&S.cards[b.dataset.c];
  if(a!=="deldoc"&&a!=="delcard"&&a!=="edel")S.armed=null;
  if(a==="open"){S.sel[S.cur.key]=b.dataset.c;S.detail=true;render();if($("pDet"))$("pDet").scrollTop=0;if(window.innerWidth<1000)window.scrollTo(0,0);}
  else if(a==="back"){S.detail=false;render();}
  else if(a==="it"){S.openIt[b.dataset.k]=!S.openIt[b.dataset.k];render();}
  else if(a==="all"){S.allOpen[c.id]=!S.allOpen[c.id];render();}
  else if(a==="topen"){S.openT[c.id]=!S.openT[c.id];render();}
  else if(a==="goto"){S.sel[areaKey(c)]=c.id;if(c.area==="library")S.lib=isCourse(c)?"course":"notes";S.detail=true;S.keep=true;location.hash=c.area;}
  else if(a==="tick"){var dm=doneMap(S.day),o=dm[c.id]||(dm[c.id]={});if(o[b.dataset.i])delete o[b.dataset.i];else o[b.dataset.i]=true;if(!S.logs[S.day])S.logs[S.day]={date:S.day,done:dm};saveLog(S.day);render();}
  else if(a==="day"){S.day=b.dataset.k;render();}
  else if(a==="wk"){S.day=dkey(addDays(parseKey(S.day),+b.dataset.n));render();}
  else if(a==="plan"){var n=+b.dataset.n,ds=(c.days||[]).slice(),i=ds.indexOf(n);if(i>=0)ds.splice(i,1);else ds.push(n);ds.sort();saveCard(Object.assign({},c,{days:ds}));}
  else if(a==="filt"){S.filt[view()]=b.dataset.f;render();}
  else if(a==="lib"){S.lib=b.dataset.l;S.detail=false;render();}
  else if(a==="ch"){var k=b.dataset.k;S.chOpen[k]=b.getAttribute("aria-expanded")!=="true";render();}
  else if(a==="edit"){openEditor(c,false);}
  else if(a==="new"){var mx=list().reduce(function(m,x){return Math.max(m,x.ord||0);},0);openEditor({id:"c"+Date.now().toString(36),area:b.dataset.a,group:"",title:"",kind:b.dataset.a==="routines"?"routine":"list",note:"",items:[],src:{doc:"",sec:""},ord:mx+1,days:[]},true);}
  else if(a==="close"){closeSheet();}
  else if(a==="edel"){if(S.armed!=="edel"){S.armed="edel";b.classList.add("armed");b.textContent="Confirm delete";return;}S.armed=null;var id=openEditor.c.id;closeSheet();delCard(id);S.detail=false;render();toast("Card deleted");}
  else if(a==="delcard"){var kc="card:"+b.dataset.c;if(S.armed!==kc){S.armed=kc;render();return;}S.armed=null;delCard(b.dataset.c);render();toast("Card deleted");}
  else if(a==="deldoc"){var d=b.dataset.d,kk="doc:"+d;if(S.armed!==kk){S.armed=kk;render();return;}S.armed=null;var ids=list().filter(function(x){return ((x.src&&x.src.doc)||"Added in the hub")===d;}).map(function(x){return x.id;});ids.forEach(delCard);render();toast(ids.length+" cards deleted");}
});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.dataset.quick){var c=S.cards[f.dataset.quick],inp=f.querySelector("input"),it=parseLine(inp.value,[],{});if(!c||!it)return;it.id="n"+Date.now().toString(36);saveCard(Object.assign({},c,{items:(c.items||[]).concat([it])}));toast("Added to "+c.title);return;}
  if(f.id==="edf"){var o=openEditor.c,card=Object.assign({},o,{area:$("e-area").value,group:$("e-group").value.trim()||"Other",title:$("e-title").value.trim(),kind:$("e-kind").value,note:$("e-note").value.trim(),items:fromText($("e-items").value,o.items),src:{doc:$("e-doc").value.trim(),sec:$("e-sec").value.trim()}});
    var u=$("e-url").value.trim();if(/^https?:\/\//.test(u))card.url=u;else delete card.url;
    if(!card.title)return;closeSheet();S.sel[areaKey(card)]=card.id;saveCard(card);toast("Card saved");}
});
$("q").addEventListener("input",function(){S.q=this.value;S.detail=false;render();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("sheet").innerHTML)closeSheet();});
window.addEventListener("hashchange",function(){S.q="";$("q").value="";S.armed=null;if(S.keep)S.keep=false;else S.detail=false;render();window.scrollTo(0,0);});

/* ---------- data ---------- */
function start(){
  render();
  var use=window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null);
  use.then(function(d){
    db=d;if(!db){S.loaded=true;S.ro=true;render();return;}
    db.collection("cards").limit(1000).onSnapshot(function(snap){var m={};snap.docs.forEach(function(x){var c=Object.assign({},x.data());c.id=x.id;m[x.id]=c;});S.cards=m;S.loaded=true;render();},function(){S.loaded=true;S.ro=true;render();});
    db.collection("logs").orderBy("date","desc").limit(120).onSnapshot(function(snap){var m={};snap.docs.forEach(function(x){m[x.id]=JSON.parse(JSON.stringify(x.data()));});S.logs=m;render();},function(){});
    var u=window.claude.use("user");if(u&&u.then)u.then(function(us){return us&&us.can?us.can("data.write"):null;}).then(function(ok){if(ok===false){S.ro=true;render();}}).catch(function(){});
  }).catch(function(){S.loaded=true;S.ro=true;render();});
}
start();
})();
</script>
